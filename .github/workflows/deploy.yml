name: Deploy Vite Site

on:
  push:
    branches: ["master"] # У вас на скриншоте ветка master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Используем стабильную 22 версию
          cache: 'npm'

      - name: Install dependencies
        run: npm install # Просто install (не ci), чтобы было надежнее

      - name: Build
        run: npm run build # Эта команда создаст папку dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # ГЛАВНОЕ: загружаем папку со сборкой, а не корень!

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
